name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-repo.mjs
      - run: node scripts/test-core.mjs
      - run: node --check plugins/bran/skills/bran/scripts/bran.mjs
      - run: node --check plugins/bran/skills/bran/scripts/compile-package.mjs
      - run: node --check plugins/bran/skills/bran/scripts/audit-package.mjs
